<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asta Dashboard - Overview</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
</head>
<body>
<script src="/assets/app.js"></script>
<script src="/assets/charts.js"></script>
<script>
let pollTimer = null;
const memHistory = [];
const cpuHistory = [];
let lastCpuSample = null; // { ms, cpuUserMs } for delta-based CPU% estimate

const COLORS = {
    accent: "#6d8bff", accent2: "#b18aff", success: "#35d399",
    danger: "#ff6570", warning: "#ffb545", info: "#4fb8ff",
};

function pushHistory(arr, val, max = 30) {
    arr.push(val);
    if (arr.length > max) arr.shift();
}

function estimateCpuPercent(cpuUserMs) {
    const now = Date.now();
    if (lastCpuSample == null) {
        lastCpuSample = { ms: now, cpuUserMs };
        return null;
    }
    const dWall = now - lastCpuSample.ms;
    const dCpu = cpuUserMs - lastCpuSample.cpuUserMs;
    lastCpuSample = { ms: now, cpuUserMs };
    if (dWall <= 0) return null;
    return Math.max(0, Math.min(100, (dCpu / dWall) * 100));
}

function statCard(label, value, opts = {}) {
    const { icon: iconName = "overview", tone = "", sub = "" } = opts;
    return `<div class="card stat-card">
        <div class="top-row">
            <div class="label">${escapeHtml(label)}</div>
            <div class="icon-wrap ${tone}">${icon(iconName)}</div>
        </div>
        <div class="value ${tone === "danger" ? "bad" : tone === "success" ? "ok" : tone === "warning" ? "warn" : ""}">${value}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
    </div>`;
}

function feedItem(tone, iconName, text, when) {
    return `<div class="feed-item">
        <div class="feed-dot ${tone}">${icon(iconName, "ic")}</div>
        <div class="feed-body">
            <div class="feed-text">${text}</div>
            <div class="feed-when">${fmtRelative(when)}</div>
        </div>
    </div>`;
}

function buildActivityFeed(notifItems, auditEntries, recoveryEntries) {
    const events = [];
    (notifItems || []).forEach((n) => events.push({ t: n.createdAt, tone: "info", icon: "bell", text: escapeHtml(n.text) }));
    (auditEntries || []).forEach((a) => events.push({
        t: a.timestamp,
        tone: a.result === "success" ? "success" : a.result === "failed" ? "danger" : "warning",
        icon: "audit",
        text: `<strong>${escapeHtml(a.admin || "system")}</strong> ${escapeHtml(a.action)}${a.target ? ` &middot; ${escapeHtml(a.target)}` : ""} <span class="badge ${a.result === "success" ? "success" : a.result === "failed" ? "danger" : "warning"}" style="margin-inline-start:6px;">${escapeHtml(a.result)}</span>`,
    }));
    (recoveryEntries || []).forEach((r) => events.push({
        t: r.timestamp,
        tone: r.result === "success" || r.ok ? "success" : "danger",
        icon: "controls",
        text: `${escapeHtml(t("selfHealingPrefix"))} <strong>${escapeHtml(r.subsystem || "system")}</strong> &middot; ${escapeHtml(r.result || (r.ok ? "success" : "failed"))}`,
    }));
    events.sort((a, b) => new Date(b.t || 0) - new Date(a.t || 0));
    return events.slice(0, 12);
}

let firstLoad = true;

async function render() {
    const content = document.getElementById("content");
    // Only show the loading skeleton on the very first paint. Background
    // auto-refreshes fetch quietly and swap the content in place, so the
    // page never flashes back to "Loading…" every 15 seconds.
    if (firstLoad) content.innerHTML = loadingState(t("loadingOverview"));

    let statusRes, statsRes, healthRes, alertsRes, advRes, notifRes, auditRes, recoveryRes;
    try {
        [statusRes, statsRes, healthRes, alertsRes, advRes, notifRes, auditRes, recoveryRes] = await Promise.all([
            api("/api/status"),
            api("/api/stats"),
            api("/api/health").catch(() => ({ health: null })),
            api("/api/alerts").catch(() => ({ alerts: [] })),
            api("/api/stats/advanced").catch(() => ({ stats: null })),
            api("/api/notifications").catch(() => ({ items: [] })),
            api("/api/audit").catch(() => ({ entries: [] })),
            api("/api/recovery").catch(() => ({ entries: [] })),
        ]);
    } catch (e) {
        if (firstLoad) withPreservedScroll(() => { content.innerHTML = e.offline ? offlineState() : errorState(e.message); });
        return;
    } finally {
        firstLoad = false;
    }

    const status = statusRes.status;
    const stats = statsRes.stats;
    const health = healthRes.health;
    const alerts = alertsRes.alerts || [];
    const adv = advRes.stats;

    pushHistory(memHistory, status.memoryUsageBytes / 1024 / 1024);
    const cpuPct = estimateCpuPercent(status.cpuUserMs);
    if (cpuPct != null) pushHistory(cpuHistory, cpuPct);

    const cpuLatest = cpuHistory.length ? cpuHistory[cpuHistory.length - 1] : null;
    const cpuTone = cpuLatest == null ? "" : cpuLatest > 80 ? "danger" : cpuLatest > 50 ? "warning" : "success";
    const memMb = status.memoryUsageBytes / 1024 / 1024;
    const memTone = memMb > 1024 ? "danger" : memMb > 512 ? "warning" : "info";

    const cardsHtml = `
        ${statCard(t("statBotStatus"), status.online ? t("online") : t("offline"), { icon: "overview", tone: status.online ? "success" : "danger" })}
        ${statCard(t("statUptime"), fmtUptime(status.uptimeSeconds), { icon: "uptime", tone: "info" })}
        ${statCard(t("statMessages"), fmtNum(stats.totalMessages), { icon: "logs", tone: "info" })}
        ${statCard(t("statCommands"), fmtNum(stats.totalCommands), { icon: "controls", tone: "success" })}
        ${statCard(t("statErrors"), fmtNum(stats.totalErrors), { icon: "alerts", tone: stats.totalErrors ? "danger" : "success" })}
        ${statCard(t("statPlugins"), fmtNum(status.pluginCount), { icon: "plugins", tone: "" })}
        ${statCard(t("statMemoryUsage"), fmtBytes(status.memoryUsageBytes), { icon: "stats", tone: memTone })}
        ${statCard(t("statCpuUsage"), cpuLatest == null ? "—" : cpuLatest.toFixed(1) + "%", { icon: "stats", tone: cpuTone, sub: escapeHtml(t("approxPerInterval")) })}
    `;

    const dailyUsage = (adv && adv.dailyUsage) || [];
    const trendLabels = dailyUsage.map((d) => d.date.slice(5));
    const commandsErrorsChart = AstaCharts.line({
        labels: trendLabels,
        series: [
            { id: "cmd", name: t("legendCommands"), color: COLORS.accent, data: dailyUsage.map((d) => d.commands) },
            { id: "err", name: t("legendErrors"), color: COLORS.danger, data: dailyUsage.map((d) => d.errors), area: false },
        ],
        height: 210,
        emptyMessage: t("noCmdErrData"),
    });
    const messagesChart = AstaCharts.line({
        labels: trendLabels,
        series: [{ id: "msg", name: t("statMessages"), color: COLORS.info, data: dailyUsage.map((d) => d.messages || 0) }],
        height: 210,
        emptyMessage: t("noMsgData"),
    });
    const pluginUsage = (adv && adv.mostUsedPlugins) || [];
    const pluginDonutColors = [COLORS.accent, COLORS.accent2, COLORS.info, COLORS.success, COLORS.warning, COLORS.danger];
    const pluginChart = AstaCharts.donut({
        segments: pluginUsage.slice(0, 6).map((p, i) => ({ label: p.plugin, value: p.count, color: pluginDonutColors[i % pluginDonutColors.length] })),
        height: 200,
        centerValue: pluginUsage.reduce((s, p) => s + p.count, 0) || 0,
        centerLabel: t("usesLabel"),
        emptyMessage: t("noPluginUsageData"),
    });

    const memSpark = AstaCharts.sparkline(memHistory, { color: COLORS.info, height: 46 });
    const cpuSpark = AstaCharts.sparkline(cpuHistory, { color: COLORS.warning, height: 46 });

    const feedEvents = buildActivityFeed(notifRes.items, (auditRes.entries || []).slice(0, 6), (recoveryRes.entries || []).slice(0, 4));

    const html = `
        <div class="grid">${cardsHtml}</div>

        <div class="section-title"><h3>${escapeHtml(t("secStatsGlance"))}</h3><span class="hint">${escapeHtml(t("secStatsHint"))}</span></div>
        <div class="grid cols-2">
            <div class="card chart-card">
                <div class="chart-head"><h4>${escapeHtml(t("chartCmdErrTitle"))}</h4>
                    <div class="chart-legend"><span><span class="dot" style="background:${COLORS.accent}"></span>${escapeHtml(t("legendCommands"))}</span><span><span class="dot" style="background:${COLORS.danger}"></span>${escapeHtml(t("legendErrors"))}</span></div>
                </div>
                ${commandsErrorsChart}
            </div>
            <div class="card chart-card">
                <div class="chart-head"><h4>${escapeHtml(t("chartMessagesTitle"))}</h4><span class="muted">${adv ? `${escapeHtml(t("retentionPrefix"))} ${adv.retentionDays}${escapeHtml(t("daysUnit"))}` : ""}</span></div>
                ${messagesChart}
            </div>
        </div>
        <div class="grid cols-2">
            <div class="card chart-card">
                <div class="chart-head"><h4>${escapeHtml(t("chartPluginUsageTitle"))}</h4><span class="muted">${escapeHtml(t("topLabel"))} ${Math.min(pluginUsage.length, 6)}</span></div>
                ${pluginChart}
                ${pluginUsage.length ? `<div class="chart-legend">${pluginUsage.slice(0, 6).map((p, i) => `<span><span class="dot" style="background:${pluginDonutColors[i % pluginDonutColors.length]}"></span>${escapeHtml(p.plugin)} (${p.count})</span>`).join("")}</div>` : ""}
            </div>
            <div class="card chart-card">
                <div class="chart-head"><h4>${escapeHtml(t("chartLiveResourceTitle"))}</h4><span class="muted">${escapeHtml(t("sampledSession"))}</span></div>
                <div class="label" style="margin-top:4px;">${escapeHtml(t("labelMemoryMb"))}</div>
                ${memSpark}
                <div class="label" style="margin-top:4px;">${escapeHtml(t("labelCpuApprox"))}</div>
                ${cpuSpark}
            </div>
        </div>

        <div class="section-title"><h3>${escapeHtml(t("secActiveAlerts"))}</h3></div>
        <div class="feed">
          ${alerts.length ? alerts.map((a) => `<div class="alert-item ${a.level}"><span><span class="badge ${a.level}">${escapeHtml(a.type)}</span> &nbsp; ${escapeHtml(a.message)}</span><span class="when">${fmtRelative(a.lastSeenAt)}</span></div>`).join("") : `<div class="notif-item"><span class="muted">${escapeHtml(t("noActiveAlerts"))}</span></div>`}
        </div>

        <div class="section-title"><h3>${escapeHtml(t("secActivityFeed"))}</h3><span class="hint">${escapeHtml(t("activityFeedHint"))}</span></div>
        <div class="feed">
          ${feedEvents.length ? feedEvents.map((e) => feedItem(e.tone, e.icon, e.text, e.t)).join("") : `<div class="notif-item"><span class="muted">${escapeHtml(t("noRecentActivity"))}</span></div>`}
        </div>

        <div class="section-title"><h3>${escapeHtml(t("secSystemHealth"))}</h3></div>
        ${health ? `
        <div class="grid">
          ${statCard(t("statConnection"), health.connectionStatus === "connected" ? t("connected") : t("disconnected"), { icon: "controls", tone: health.online ? "success" : "danger" })}
          ${statCard(t("statOverallState"), health.watchdogState || "disabled", { icon: "alerts", tone: health.watchdogState === "HEALTHY" ? "success" : health.watchdogState === "DEGRADED" ? "warning" : "danger" })}
          ${statCard(t("statReconnects"), fmtNum(health.reconnectCount), { icon: "link", tone: health.reconnectCount ? "warning" : "success" })}
          ${statCard(t("statRecoveryAttempts"), fmtNum(health.recovery ? health.recovery.totalAttempts : 0), { icon: "controls", tone: health.recovery && health.recovery.totalFailures ? "warning" : "success" })}
        </div>
        ${health.lastImportantError ? `<div class="error-text">${escapeHtml(t("lastImportantErrorLabel"))} (${escapeHtml(health.lastImportantError.source || "")}, ${fmtRelative(health.lastImportantError.at)}): ${escapeHtml(health.lastImportantError.message)}</div>` : ""}
        ${health.watchdogSubsystems && Object.keys(health.watchdogSubsystems).length ? `
        <div class="table-wrap">
        <table>
          <thead><tr><th>${escapeHtml(t("tableSubsystem"))}</th><th>${escapeHtml(t("tableState"))}</th><th class="wrap">${escapeHtml(t("tableDetail"))}</th></tr></thead>
          <tbody>
            ${Object.entries(health.watchdogSubsystems).map(([name, s]) => `<tr><td>${escapeHtml(name)}</td><td><span class="badge ${s.health === "HEALTHY" ? "success" : (s.health === "DEGRADED" ? "warning" : "danger")}">${escapeHtml(s.health)}</span></td><td class="wrap muted">${escapeHtml(s.lastDetail || "-")}</td></tr>`).join("")}
          </tbody>
        </table>
        </div>` : ""}
        ` : emptyState(t("healthNotAvailable"))}
    `;
    withPreservedScroll(() => { content.innerHTML = html; });
}

(async () => {
    await requireAuth();
    renderShell("/", t("overview"));
    await render();
    pollTimer = setInterval(render, 15000);
})();
</script>
</body>
</html>
